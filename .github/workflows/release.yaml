name: Build release asset

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.9.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.NUMBER format"
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          manifest_version="$(jq -r '.version' custom_components/philips_heater_coap/manifest.json)"
          if [[ "$manifest_version" != "$release_version" ]]; then
            echo "Manifest version '$manifest_version' does not match tag version '$release_version'"
            exit 1
          fi

      - name: Create release zip
        run: |
          mkdir -p dist
          cp -r custom_components/philips_heater_coap dist/

          find dist -type d -name "__pycache__" -exec rm -rf {} +
          find dist -type f -name "*.pyc" -delete

          cd dist/philips_heater_coap
          zip -r ../../philips-heater-coap.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: philips-heater-coap.zip
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: Philips Heater ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
